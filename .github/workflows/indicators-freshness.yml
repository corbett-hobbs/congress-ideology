name: Indicators freshness

# Automate the check and the acceptance; the gate is the full CI run (.github/actions/gate-and-merge).
#
# Weekly: re-fetch the FRED economic-indicator series and compare against the
# committed snapshots in pipeline/raw/fred/. FRED revises history, so a naive
# git diff is noisy. The materiality rule (pipeline/fetch/fred-diff.ts,
# documented in docs/INDICATORS_METHODOLOGY.md):
#   - a new observation, a removed one, or a missing<->value flip always counts;
#   - a revision to an existing value counts only above that series'
#     `revision_tolerance` (lib/indicator-entities.ts);
#   - every revision, material or not, is listed (largest first) in the PR body.
# If nothing is material no PR opens and the working tree is discarded, so
# sub-tolerance revisions accumulate until the next material change carries
# them in. Auto-merged only after the full CI gate passes (.github/actions/gate-and-merge).
#
# Requires the repo secret FRED_API_KEY, and
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)
#
# Note: the PR branch is pushed with GITHUB_TOKEN, so it does NOT trigger the
# CI workflow. Run `pnpm pipeline:check` locally before merging.

on:
  schedule:
    - cron: "43 11 * * 1" # Mondays 11:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: indicators-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Snapshot the committed raw data
        run: cp -r pipeline/raw/fred "$RUNNER_TEMP/fred-prev"

      - name: Re-fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: pnpm fetch:fred

      - name: Apply the materiality rule
        id: diff
        run: pnpm exec tsx pipeline/fetch/fred-diff.ts "$RUNNER_TEMP/fred-prev" pipeline/raw/fred "$RUNNER_TEMP/fred-summary.md"

      - name: Rebuild and validate
        id: build
        if: steps.diff.outputs.material == 'true'
        run: |
          set +e
          pnpm exec tsx pipeline/transform/indicators-run.ts > transform.log 2>&1
          code=$?
          cat transform.log
          echo "transform_ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            cat "$RUNNER_TEMP/fred-summary.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open pull request
        id: cpr
        if: steps.diff.outputs.material == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pipeline/raw/fred
            pipeline/output/indicator_series.json
            pipeline/output/indicator_observations.json
            pipeline/output/indicators_report.json
          branch: data/indicators-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh economic indicators"
          title: "Economic indicators refresh"
          labels: data-refresh
          body: |
            The weekly FRED check found a material change (new observations, or a revision above a series' tolerance).

            **Transform + coverage validation succeeded:** `${{ steps.build.outputs.transform_ok }}`

            **What changed** (all revisions are listed, largest first; the tolerance only decides whether this PR opens):

            ${{ steps.build.outputs.summary }}

            **Before merging**

            - A revision is FRED restating history (BLS benchmark revisions, Census re-basing). Confirm nothing here is a series redefinition.
            - `pnpm validate && pnpm transform` must pass, including the display-window coverage assertion.

            Merged automatically only if typecheck, lint, tests, `pnpm pipeline:check` and the build all pass on this branch
            (.github/actions/gate-and-merge). If you are reading this on an open PR, that gate failed: see the run log.

      # Auto-merge only if the full CI gate passes (.github/actions/gate-and-merge); otherwise
      # this step fails and the PR stays open for a human.
      - name: Gate and merge
        if: contains(fromJSON('["created","updated"]'), steps.cpr.outputs.pull-request-operation)
        uses: ./.github/actions/gate-and-merge
        with:
          pr-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
