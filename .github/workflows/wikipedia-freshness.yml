name: Wikipedia bios freshness

# Automate the check and the acceptance; the gate is the full CI run (.github/actions/gate-and-merge).
#
# Weekly: re-fetch every current member's Wikipedia lead and, if the trimmed
# result differs from pipeline/output/wikipedia_summaries.json, open a pull
# request. Auto-merged only after the full CI gate passes (.github/actions/gate-and-merge); if
# it fails the PR stays open for review. Each record's `revision` is in the diff, so
# vandalism can still be checked in the article history afterward. A record only changes when the SHOWN text changes; edits
# elsewhere in an article produce no diff.
#
# Requires repo setting:
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)
#
# Note: the PR branch is pushed with GITHUB_TOKEN, so it does NOT trigger the
# CI workflow. Re-run `pnpm validate` locally before merging.

on:
  schedule:
    - cron: "43 9 * * 1" # Mondays 09:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wikipedia-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-fetch Wikipedia summaries
        run: pnpm fetch:wikipedia

      - name: Validate
        run: pnpm validate

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- pipeline/output/wikipedia_summaries.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Wikipedia summaries are unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- pipeline/output/wikipedia_summaries.json
          fi

      - name: Open pull request
        id: cpr
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: pipeline/output/wikipedia_summaries.json
          branch: data/wikipedia-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh Wikipedia bios"
          title: "Wikipedia bios refresh"
          labels: data-refresh
          body: |
            The weekly freshness check found changes to member Wikipedia leads.

            **Before merging**

            - Review the diff in `pipeline/output/wikipedia_summaries.json`.
              Each changed record carries the `revision` its new text came from —
              open the article history for anything that looks wrong (vandalism, wrong person).
            - Check any record with `needs_review: true`.
            - Locally: `pnpm validate`.

            Merged automatically only if typecheck, lint, tests, `pnpm pipeline:check` and the build all pass on this branch
            (.github/actions/gate-and-merge). If you are reading this on an open PR, that gate failed: see the run log.

      # Auto-merge only if the full CI gate passes (.github/actions/gate-and-merge); otherwise
      # this step fails and the PR stays open for a human.
      - name: Gate and merge
        if: contains(fromJSON('["created","updated"]'), steps.cpr.outputs.pull-request-operation)
        uses: ./.github/actions/gate-and-merge
        with:
          pr-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
