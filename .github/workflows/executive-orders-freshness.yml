name: Executive orders freshness

# Automate the check, gate the acceptance on a human.
#
# Weekly: re-fetch executive orders (1994-present) from the Federal Register
# API and diff against pipeline/raw/federal-register/. On a meaningful diff,
# open a pull request. Never auto-merged.
#
# New orders have no topic yet and CI never classifies. So after the fetch this
# job (1) lets amending/revoking orders inherit their parent's topic
# (`pnpm classify:eos`, deterministic) and (2) re-runs the executive-orders
# transform. Any order still without a topic makes the transform fail LOUDLY:
# the PR is opened anyway with the list of orders to classify, and its CI stays
# red until a human adds a topic for each to
# pipeline/classification/eo_topics.json.
#
# Requires repo setting:
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)
#
# Note: the PR branch is pushed with GITHUB_TOKEN, so it does NOT trigger the
# CI workflow. Run `pnpm pipeline:check` locally before merging.

on:
  schedule:
    - cron: "17 10 * * 1" # Mondays 10:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: executive-orders-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-fetch executive orders
        run: pnpm fetch:executive-orders

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- pipeline/raw/federal-register; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Executive orders are unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- pipeline/raw/federal-register
          fi

      - name: Inherit parent topics, then rebuild
        id: build
        if: steps.detect.outputs.changed == 'true'
        run: |
          set +e
          pnpm classify:eos > classify.log 2>&1
          pnpm exec tsx pipeline/transform/executive-orders-run.ts > transform.log 2>&1
          code=$?
          cat classify.log transform.log
          {
            echo "unclassified<<EOF"
            sed -n '/still need a topic/,$p' classify.log
            echo "EOF"
            echo "transform_ok=$([ "$code" -eq 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pipeline/raw/federal-register
            pipeline/classification
            pipeline/output/executive_orders.json
            pipeline/output/executive_orders_report.json
            pipeline/output/administrations.json
          branch: data/executive-orders-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh executive orders"
          title: "Executive orders refresh"
          labels: data-refresh
          body: |
            The weekly check found changes to the Federal Register executive-orders snapshot.

            **Transform succeeded:** `${{ steps.build.outputs.transform_ok }}`

            **Orders still needing a topic** (empty means none). CI never classifies and never defaults to "other":
            add each to `pipeline/classification/eo_topics.json` (`topic_method: "manual"`, or
            `pnpm classify:eos -- --labels <file>`), then `pnpm transform`.

            ```
            ${{ steps.build.outputs.unclassified }}
            ```

            **Before merging**

            - Skim the raw diff in `pipeline/raw/federal-register/executive_orders.json`.
            - `pnpm validate && pnpm transform` must pass, including the count anchors in
              `pipeline/transform/executive-orders.ts` (`ANCHORS`). A new Biden/2025 count can't change, so a
              failure means the Federal Register itself changed — verify against federalregister.gov.
            - Check any `needs_review` orders in the new rows.

            Not auto-merged by design.
