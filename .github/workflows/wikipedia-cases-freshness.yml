name: Wikipedia case-article links freshness

# Keeps the Decisions page's case-name links and one-sentence case summaries current as new opinions are decided and Wikipedia
# writes their articles.
#
# Weekly: re-read Wikipedia's Supreme Court volume and term lists (`pnpm fetch:wikipedia-cases`, ~300 requests, polite
# User-Agent). If any list row, article link or redirect changed, re-run the decisions transform (which joins the lists to
# SCDB by U.S. cite, docket, then name and year: pipeline/transform/wikipedia-cases.ts, with its own gate) and open a pull
# request with the new snapshot and pipeline/output/decisions_*.json. If Wikipedia is unreachable the job ends GREEN WITH A
# WARNING ANNOTATION, never a red failure (same stance as scdb-freshness). A changed list layout makes the fetch throw, which
# is a real failure on purpose.
#
# Requires repo setting:
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wikipedia-cases-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch Wikipedia's case lists
        id: fetch
        run: |
          set +e
          pnpm fetch:wikipedia-cases
          code=$?
          # The opening of any article not fetched before (one sentence per case comes from it); exit 2 = unreachable, as above.
          if [ "$code" -eq 0 ]; then
            pnpm fetch:wikipedia-case-leads
            code=$?
          fi
          set -e
          if [ "$code" -eq 2 ]; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Wikipedia case-link refresh skipped::en.wikipedia.org was unreachable or rate-limited the job. It will retry next week."
            echo "### Wikipedia case-link refresh skipped: host unreachable" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Detect changes
        id: detect
        if: steps.fetch.outputs.unreachable != 'true'
        run: |
          if [ -z "$(git status --porcelain -- pipeline/raw/wikipedia-cases)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in Wikipedia's case lists."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-run the decisions transform
        if: steps.detect.outputs.changed == 'true'
        run: pnpm exec tsx pipeline/transform/decisions-run.ts

      - name: Open pull request
        id: cpr
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pipeline/raw/wikipedia-cases
            pipeline/output/decisions_*.json
          branch: data/wikipedia-cases-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh Wikipedia article links for Supreme Court cases"
          title: "Wikipedia case-link refresh"
          labels: data-refresh
          body: |
            Wikipedia's Supreme Court volume and term lists changed (a new article, a renamed one, or new decisions).
            `pipeline/output/decisions_articles.json`, `decisions_summaries.json` (the one-sentence case summaries, from each new
            article's opening) and the report (`decisions_report.json` > `case_articles`, `case_summaries`) are regenerated.

            Merged automatically only if typecheck, lint, tests, `pnpm pipeline:check` and the build all pass on this branch
            (.github/actions/gate-and-merge). If you are reading this on an open PR, that gate failed: see the run log.

      - name: Gate and merge
        if: contains(fromJSON('["created","updated"]'), steps.cpr.outputs.pull-request-operation)
        uses: ./.github/actions/gate-and-merge
        with:
          pr-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
