name: CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Re-run validate + transform on the committed raw snapshots and fail if
      # the output is stale or validation trips. A bad data or transform change
      # can't merge silently. (Re-fetching from upstream is the weekly
      # voteview-freshness job's role, not CI's — CI must stay deterministic.)
      - run: pnpm pipeline:check

      - run: pnpm build
