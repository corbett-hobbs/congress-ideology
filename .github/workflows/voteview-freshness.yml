name: Voteview data freshness

# Automate the check and the acceptance; the gate is the full CI run (.github/actions/gate-and-merge).
#
# Weekly: re-fetch the Voteview HSall files and, if they differ from the
# snapshot committed in pipeline/raw/voteview/, open a pull request with the
# change. Auto-merged only after the full CI gate passes (.github/actions/gate-and-merge); if it fails the PR stays open for review.
#
# Requires repo setting:
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)
#
# Note: the PR branch is pushed with GITHUB_TOKEN, so it does NOT trigger the
# CI workflow. Re-run `pnpm validate && pnpm transform` locally before merging.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: voteview-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-fetch Voteview snapshot
        run: pnpm fetch:voteview

      # The roll calls (93rd Congress on) the Laws transform checks passage tallies against; the gate re-runs that
      # transform, so a roll call that now contradicts a law's tally fails the gate and the PR stays open.
      - name: Re-fetch Voteview roll calls
        run: pnpm fetch:voteview-rollcalls

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- pipeline/raw/voteview; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Voteview snapshot is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- pipeline/raw/voteview
          fi

      - name: Open pull request
        id: cpr
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: pipeline/raw/voteview
          branch: data/voteview-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh Voteview snapshot"
          title: "Voteview data refresh"
          labels: data-refresh
          body: |
            The weekly freshness check found upstream changes to the Voteview
            `HSall` files or the roll calls the Laws track checks passage votes against.

            **Before merging**

            - Review the diff in `pipeline/raw/voteview/`.
            - Locally: `pnpm validate && pnpm transform`, commit the updated
              `pipeline/output/_manifest.json`.
            - Bump the citation year in `docs/CREDITS.md` if it changed.

            Merged automatically only if typecheck, lint, tests, `pnpm pipeline:check` and the build all pass on this branch
            (.github/actions/gate-and-merge). If you are reading this on an open PR, that gate failed: see the run log.

      # Auto-merge only if the full CI gate passes (.github/actions/gate-and-merge); otherwise
      # this step fails and the PR stays open for a human.
      - name: Gate and merge
        if: contains(fromJSON('["created","updated"]'), steps.cpr.outputs.pull-request-operation)
        uses: ./.github/actions/gate-and-merge
        with:
          pr-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
