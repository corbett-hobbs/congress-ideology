name: Trade freshness

# Automate the check and the acceptance; the gate is the full CI run (.github/actions/gate-and-merge).
#
# Weekly: re-fetch the Census trade sources (country.xlsx, gands.xlsx, Schedule C,
# and the calculated-duties API), rebuild pipeline/output/, and open a PR only when the
# rebuilt output differs from what is committed. Census re-issues its spreadsheets with
# new bytes even when no number changed, so the comparison is on the OUTPUT, not the
# raw files. A validation failure (pipeline/transform/trade.ts) fails the job loudly
# instead of opening a PR. Auto-merged only after the full CI gate passes (.github/actions/gate-and-merge).
#
# Requires the repo secret CENSUS_API_KEY, and
#   Settings > Actions > General > "Allow GitHub Actions to create and
#   approve pull requests"  (off by default)
#
# Note: the PR branch is pushed with GITHUB_TOKEN, so it does NOT trigger the
# CI workflow. Run `pnpm pipeline:check` locally before merging.

on:
  schedule:
    - cron: "17 12 * * 3" # Wednesdays 12:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trade-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-fetch Census trade data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: pnpm fetch:census-trade

      - name: Rebuild and validate
        run: pnpm exec tsx pipeline/transform/trade-run.ts

      - name: Did the output change?
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- pipeline/output)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              git diff --stat -- pipeline/output | tail -n 25
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pipeline/raw/census-trade
            pipeline/output/countries.json
            pipeline/output/trade_national.json
            pipeline/output/trade_by_country
            pipeline/output/duties_national.json
            pipeline/output/duties_by_country
            pipeline/output/trade_report.json
          branch: data/trade-refresh
          base: main
          delete-branch: true
          commit-message: "chore(pipeline): refresh Census trade data"
          title: "Census trade data refresh"
          labels: data-refresh
          body: |
            The weekly Census check rebuilt `pipeline/output/` and it differs from what is committed. Validation and reconciliation passed (a failure would have failed the job instead of opening this PR).

            **Output changes**

            ${{ steps.diff.outputs.summary }}

            **Before merging**

            - Census restates history (annual revisions each June). Confirm nothing here is a redefinition: check `trade_report.json` (coverage, partner counts, reconciliation gaps).
            - A new Census country code fails the build until it is added deliberately (`pipeline/transform/trade.ts`, `trade-iso.ts`).
            - Run `pnpm pipeline:check` locally.

            Merged automatically only if typecheck, lint, tests, `pnpm pipeline:check` and the build all pass on this branch
            (.github/actions/gate-and-merge). If you are reading this on an open PR, that gate failed: see the run log.

      # Auto-merge only if the full CI gate passes (.github/actions/gate-and-merge); otherwise
      # this step fails and the PR stays open for a human.
      - name: Gate and merge
        if: contains(fromJSON('["created","updated"]'), steps.cpr.outputs.pull-request-operation)
        uses: ./.github/actions/gate-and-merge
        with:
          pr-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
